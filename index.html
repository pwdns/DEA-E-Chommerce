<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEA E-Commerce</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>DEA E-Commerce</h1>
    <p>Simple online store demo</p>
  </header>

  <main class="layout">
    <section aria-label="Products">
      <h2>Products</h2>
      <div id="product-list" class="product-grid"></div>
    </section>

    <aside class="cart" aria-label="Shopping cart">
      <h2>Cart</h2>
      <ul id="cart-items"></ul>
      <p id="cart-empty">Your cart is empty.</p>
      <p class="total">Total: $<span id="cart-total">0.00</span></p>
      <button id="checkout-btn" type="button">Checkout</button>
      <p id="checkout-message" role="status" aria-live="polite"></p>
    </aside>
  </main>

  <script src="./app.js"></script>
</body>
</html>
